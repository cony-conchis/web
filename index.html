<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logoarbol.ico">
    <title>San Cayetano Limpio| PREPAENLINEA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos generales */
        body {
            margin: 12;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 95%;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
            position: relative;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #90caf9;
        }

        .hero {
            background-image: url(Sancaye.jpeg); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        .hero h1 {
            font-size: 4em;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            margin: 0;
        }

        .hero p {
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            margin: 0;
        }

        .hero button {
            background-color: #ff5722;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .hero button:hover {
            background-color: #e64a19;
        }

        /* Estilo específico para texto con fondo verde */
        .fondo-verde {
            background-color: green;
            padding: 10px;
            border-radius: 5px;
        }

        /* Estilos responsivos */
        @media (max-width: 768px) {
            .logo {
                font-size: 1.5em;
            }

            nav ul {
                flex-direction: column;
                gap: 10px;
            }

            .hero h1 {
                font-size: 2.5em;
            }

            .hero p {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SAN CAYETANO LIMPIO</div>
        <nav>
            <ul>
                <li><a href="planificacion.html">Planificación</a></li>
                <li><a href="justificacion.html">Justificación</a></li>
                <li><a href="organizacion.html">Organización</a></li>
                <li><a href="direccion.html">Dirección</a></li>
                <li><a href="controlg.html">Control / Gantt</a></li>
                <li><a href="controlm.html">Control / Medir corregir</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero" id="inicio">
            <h1>BASURA EN MI COMUNIDAD</h1>
            <p>Un Proyecto de Conciencia y Acción</p>
            <button onclick="window.location.href='mas_informacion.html'">MÁS INFORMACIÓN</button>

        </section>
        
    </main>
</body>
</html>
